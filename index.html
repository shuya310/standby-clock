<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>スタンバイ時計</title>

  <!-- ホーム画面から起動したときに全画面で開く -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="時計">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <!-- DIN Condensed が無い環境（Apple 製品以外）向けの代替フォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500&family=Zen+Kaku+Gothic+New:wght@500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="clock" id="clock" aria-live="off">
    <div class="time" role="timer" aria-label="現在時刻">
      <div class="pair">
        <span class="digit" id="h1">0</span>
        <span class="digit" id="h2">0</span>
      </div>
      <div class="colon" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <div class="pair">
        <span class="digit" id="m1">0</span>
        <span class="digit" id="m2">0</span>
      </div>
      <div class="pair seconds">
        <span class="digit" id="s1">0</span>
        <span class="digit" id="s2">0</span>
      </div>
    </div>
    <p class="date" id="date"></p>
  </main>

  <!-- タップで 自動 → 昼 → 夜 を切り替えたときだけ一瞬表示する -->
  <div class="toast" id="toast" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
